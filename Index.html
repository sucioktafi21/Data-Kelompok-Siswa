<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identitas Kelompok E-LKPD</title>
</head>
<body style="margin: 0; padding: 0; background-color: transparent;">

<div style="
  font-family: 'Segoe UI', Arial, sans-serif;
  width: 95%;
  max-width: 850px;
  margin: 10px auto;
  padding: 20px 24px;
  background: linear-gradient(145deg, #ffffff, #f0f7ff);
  border: 1px solid #d5e7ff;
  border-radius: 18px;
  box-shadow: 0 6px 20px rgba(35, 100, 180, 0.12);
  color: #19365b;
  box-sizing: border-box;
">

  <!-- HEADER LANDSCAPE -->
  <div style="
    background: linear-gradient(135deg, #1769c2, #63a7f5);
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 18px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  ">
    <div style="font-size: 26px;">🧪</div>
    <div>
      <div style="font-size: 18px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;">
        Identitas Kelompok
      </div>
      <div style="font-size: 12px; opacity: 0.95;">
        E-LKPD Interaktif · Kesetimbangan Kimia
      </div>
    </div>
  </div>

  <!-- CONTAINER GRID LANDSCAPE (2 KOLOM SAMA TINGGI) -->
  <div style="
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
    margin-bottom: 16px;
  ">

    <!-- KOLOM KIRI: KODE KELOMPOK & KELAS -->
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div>
        <label for="kode" style="
          display: block;
          font-size: 13px;
          font-weight: 700;
          margin-bottom: 6px;
          color: #234d7d;
        ">
          🔑 Kode Kelompok
        </label>
        <select id="kode" required style="
          width: 100%;
          padding: 10px 12px;
          border: 1px solid #bfd8f6;
          border-radius: 9px;
          background: #ffffff;
          color: #234d7d;
          font-size: 13px;
          font-weight: 600;
          outline-color: #438fe5;
          box-sizing: border-box;
        ">
          <option value="">Pilih kelompokmu</option>
          <option value="KLP01">KLP01 — Kelompok 1</option>
          <option value="KLP02">KLP02 — Kelompok 2</option>
          <option value="KLP03">KLP03 — Kelompok 3</option>
          <option value="KLP04">KLP04 — Kelompok 4</option>
          <option value="KLP05">KLP05 — Kelompok 5</option>
          <option value="KLP06">KLP06 — Kelompok 6</option>
          <option value="KLP07">KLP07 — Kelompok 7</option>
          <option value="KLP08">KLP08 — Kelompok 8</option>
          <option value="KLP09">KLP09 — Kelompok 9</option>
          <option value="KLP10">KLP10 — Kelompok 10</option>
        </select>
      </div>

      <div>
        <label for="kelas" style="
          display: block;
          font-size: 13px;
          font-weight: 700;
          margin-bottom: 6px;
          color: #234d7d;
        ">
          🏫 Kelas
        </label>
        <input type="text" id="kelas" required placeholder="Contoh: XI. 3.1" style="
          width: 100%;
          padding: 10px 12px;
          border: 1px solid #bfd8f6;
          border-radius: 9px;
          background: #ffffff;
          color: #19365b;
          font-family: inherit;
          font-size: 13px;
          box-sizing: border-box;
          outline-color: #438fe5;
        ">
      </div>
    </div>

    <!-- KOLOM KANAN: NAMA ANGGOTA KELOMPOK -->
    <div>
      <label for="anggota" style="
        display: block;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #234d7d;
      ">
        👥 Nama Anggota Kelompok
      </label>
      <textarea id="anggota" required
        placeholder="Tuliskan nama seluruh anggota kelompok...&#10;1. Nama anggota 1&#10;2. Nama anggota 2&#10;3. Nama anggota 3"
        style="
          width: 100%;
          height: 102px;
          padding: 10px 12px;
          border: 1px solid #bfd8f6;
          border-radius: 9px;
          background: #ffffff;
          color: #19365b;
          font-family: inherit;
          font-size: 13px;
          line-height: 1.5;
          resize: none;
          box-sizing: border-box;
          outline-color: #438fe5;
        "
      ></textarea>
      <div style="font-size: 11px; color: #7189a7; margin-top: 4px;">
        💡 Masukkan nama setiap anggota pada baris terpisah.
      </div>
    </div>

  </div>

  <!-- TOMBOL KONFIRMASI LOKAL -->
  <button type="button" onclick="simpanIdentitas()" style="
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #1769c2, #3989e8);
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 0.2px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(23, 105, 194, 0.2);
  ">
    💾 Simpan Identitas Kelompok
  </button>

  <div id="st" role="status" aria-live="polite" style="
    font-size: 12px;
    margin-top: 10px;
    text-align: center;
    font-weight: 600;
    line-height: 1.5;
  "></div>

  <!-- FOOTER -->
  <div style="
    text-align: center;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #dceafa;
    font-size: 11px;
    color: #7189a7;
  ">
    ✦ Identitas tersimpan otomatis di perangkat · Lanjut kerjakan ke slide berikutnya ✦
  </div>

</div>

<!-- SCRIPT AUTOSAVE LOKAL (TANPA KIRIM KE SHEETS DI AWAL) -->
<script>
  // 1. FUNGSI UTAMA AUTO-SAVE KE MEMORI BROWSER (localStorage)
  function simpanOtomatisLokal() {
    const kode = document.getElementById("kode").value;
    const anggota = document.getElementById("anggota").value;
    const kelas = document.getElementById("kelas").value;

    localStorage.setItem("elkpd_kode", kode);
    localStorage.setItem("elkpd_anggota", anggota);
    localStorage.setItem("elkpd_kelas", kelas);
  }

  // 2. FUNGSI UNTUK MEMUAT KEMBALI ISIAN SAAT SLIDE DIBUKA
  function muatOtomatisLokal() {
    const savedKode = localStorage.getItem("elkpd_kode");
    const savedAnggota = localStorage.getItem("elkpd_anggota");
    const savedKelas = localStorage.getItem("elkpd_kelas");

    if (savedKode) document.getElementById("kode").value = savedKode;
    if (savedAnggota) document.getElementById("anggota").value = savedAnggota;
    if (savedKelas) document.getElementById("kelas").value = savedKelas;
  }

  // PASANG LISTENER AUTO-SAVE SAAT KETIK / PILIH
  window.addEventListener("DOMContentLoaded", () => {
    muatOtomatisLokal();

    document.getElementById("kode").addEventListener("change", simpanOtomatisLokal);
    document.getElementById("anggota").addEventListener("input", simpanOtomatisLokal);
    document.getElementById("kelas").addEventListener("input", simpanOtomatisLokal);
  });

  // 3. FUNGSI TOMBOL KONFIRMASI
  function simpanIdentitas() {
    const kode = document.getElementById("kode").value.trim();
    const anggota = document.getElementById("anggota").value.trim();
    const kelas = document.getElementById("kelas").value.trim();
    const st = document.getElementById("st");

    if (!kode || !anggota || !kelas) {
      st.innerText = "⚠️ Mohon lengkapi semua kolom terlebih dahulu!";
      st.style.color = "#d9534f";
      return;
    }

    // Mengunci data di localStorage
    simpanOtomatisLokal();

    st.innerText = "✅ Identitas Kelompok " + kode + " tersimpan di perangkat! Silakan lanjut ke slide berikutnya.";
    st.style.color = "#28a745";
  }
</script>

</body>
</html>
